name: Release Docs (INTERNAL)

on:
  workflow_call:

permissions:
  contents: read
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: docs-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Verify provenance and brand clearance before publishing
        run: python dev/check_release_readiness.py
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SYNOR_DOCS_DEPLOY_KEY }}
      - name: Install dependencies
        run: npm --prefix docs ci
      - name: Build docs site
        env:
          # Re-exported from the Docusaurus era (commit b8e0eda removed
          # them when the docs migrated to Astro). Names match the
          # original config so the existing GitHub Actions vars keep
          # working; Search.astro reads them in frontmatter and inlines
          # the values into the client bundle via `define:vars`. The
          # Algolia "search-only API key" is public by design — the
          # index is read-only with that key.
          SYNOR_DOCS_ALGOLIA_APP_ID:  ${{ vars.SYNOR_DOCS_ALGOLIA_APP_ID }}
          SYNOR_DOCS_ALGOLIA_API_KEY: ${{ vars.SYNOR_DOCS_ALGOLIA_API_KEY }}
          SYNOR_DOCS_SITE_URL: ${{ vars.SYNOR_DOCS_SITE_URL }}
        run: npm --prefix docs run build
      - name: Deploy to the verified documentation repository
        env:
          DEPLOY_USER_EMAIL: ${{ vars.SYNOR_DOCS_DEPLOY_USER_EMAIL }}
          DEPLOY_USER_NAME: ${{ vars.SYNOR_DOCS_DEPLOY_USER_NAME }}
          TARGET_REPO: ${{ vars.SYNOR_DOCS_TARGET_REPO }}
        run: |
          set -euo pipefail
          test -n "$TARGET_REPO"
          git config --global user.email "$DEPLOY_USER_EMAIL"
          git config --global user.name "$DEPLOY_USER_NAME"

          TMP=$(mktemp -d)
          if ! git clone --depth 1 --branch gh-pages "$TARGET_REPO" "$TMP"; then
            # First deploy: seed an empty gh-pages branch.
            git clone --depth 1 "$TARGET_REPO" "$TMP"
            cd "$TMP"
            git checkout --orphan gh-pages
            git rm -rf . || true
            cd -
          fi

          # Replace contents, preserving the CNAME file (domain mapping)
          # and .git so the branch history continues.
          find "$TMP" -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name CNAME -exec rm -rf {} +
          cp -a docs/dist/. "$TMP/"

          cd "$TMP"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "deploy docs from ${GITHUB_SHA::7}"
          git push origin gh-pages
