[project]
name = "bigquery-target"
version = "0.1.0"
description = "Synor example: write managed target rows to BigQuery."
requires-python = ">=3.11"
dependencies = [
    "synor[bigquery]>=0.1.0a1",
    "google-cloud-bigquery>=3.0.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
py-modules = ["main"]
