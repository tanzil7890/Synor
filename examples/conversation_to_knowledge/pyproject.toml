[project]
name = "conversation-to-knowledge"
version = "0.1.0"
description = "Synor example: convert podcast sessions to a knowledge graph in SurrealDB."
requires-python = ">=3.11"
dependencies = [
    "synor[surrealdb,sentence_transformers]>=0.1.0a1",
    "yt-dlp",
    "assemblyai",
    "instructor",
    "litellm",
    "faiss-cpu",
    "numpy",
    "pydantic",
]

[tool.setuptools]
packages = ["conv_knowledge"]
