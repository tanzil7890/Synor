[project]
name = "postgres-source-v1"
version = "0.1.0"
description = "Synor v1 example: read from PostgreSQL source and write embeddings back to Postgres."
requires-python = ">=3.11"
dependencies = [
    "synor[postgres,sentence_transformers]>=0.1.0a1",
    "asyncpg>=0.29.0",
    "pgvector>=0.4.1",
    "numpy",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = []
