[project]
name = "oci-object-storage-embedding-v1"
version = "0.1.0"
description = "Synor v1 example: embed OCI Object Storage text files into Postgres/pgvector, with optional live updates via OCI Streaming."
requires-python = ">=3.11"
dependencies = [
    "synor[oci,kafka,postgres,sentence_transformers]>=0.1.0a1",
    "asyncpg>=0.29.0",
    "pgvector>=0.4.1",
    "numpy",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = []
