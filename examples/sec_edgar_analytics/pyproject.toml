description = "Synor example: index multi-format SEC filings into Apache Doris with vector + full-text indexes for hybrid search."
requires-python = ">=3.11"
dependencies = [
    "synor[doris,sentence_transformers]>=0.1.0a1",
    "aiohttp>=3.9.0",
    "pymysql>=1.1.0",
