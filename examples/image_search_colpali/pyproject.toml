[project]
name = "image-search-colpali-v1"
version = "0.1.0"
description = "Synor v1 example: image search with ColPali embeddings stored in Qdrant."
requires-python = ">=3.11"
dependencies = [
    "synor[colpali,qdrant]>=0.1.0a1",
    "transformers>=4.45.0,<5",
    "fastapi>=0.100.0",
    "torch>=2.0.0",
    "pillow>=10.0.0",
    "qdrant-client>=1.14.2",
    "uvicorn>=0.34.3",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = []
