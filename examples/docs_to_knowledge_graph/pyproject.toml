[project]
name = "docs-to-knowledge-graph"
version = "0.1.0"
description = "Synor example: build a knowledge graph from Markdown docs (concept triples) in Neo4j."
requires-python = ">=3.11"
dependencies = [
    "synor[neo4j]>=0.1.0a1",
    "instructor",
    "litellm",
    "pydantic",
]

[tool.setuptools]
py-modules = ["main"]
